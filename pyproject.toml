[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prometheus-lsp"
version = "0.1.1-dev"
description = "Language Server Protocol implementation for the Prometheus (.prm) language"
requires-python = ">=3.12"
dependencies = [
    "pygls>=2.0",
    "lsprotocol>=2023.0",
]

[project.scripts]
prometheus-lsp = "prometheus_lsp.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --showlocals"